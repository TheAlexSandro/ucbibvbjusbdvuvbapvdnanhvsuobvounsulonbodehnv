app = 'ucbibvbjusbdvuvbapvdnanhvsuobvounsulonbodehnv'
primary_region = 'sin'

[build]

[deploy]
  strategy = 'immediate'

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/ping'

[[vm]]
  size = 'shared-cpu-4x'
  memory = '1024'
